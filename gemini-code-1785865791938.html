<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WxTool - Advanced Weather Palette Editor</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-card: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 950px; margin: 0 auto; line-height: 1.5; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-weight: 800; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 14px; font-size: 15px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 8px; font-weight: 600; transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .panel { display: none; background: var(--surface); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .panel.active { display: block; }
        .control-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        textarea { width: 100%; height: 140px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; padding: 12px; background: var(--bg); color: #38bdf8; border: 1px solid var(--border); border-radius: 6px; resize: vertical; }
        select, input[type="number"], input[type="text"], button { padding: 10px 14px; background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; color: var(--text); outline: none; }
        select:focus, input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: #0f172a; border: none; cursor: pointer; font-weight: 700; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.secondary { background: var(--surface-card); color: var(--text); border: 1px solid var(--border); }
        button.success { background: var(--success); color: #000; }
        button.danger { background: var(--danger); color: #fff; }
        .flex-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
        .transform-box { background: var(--surface-card); padding: 18px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
        .import-box { background: #162435; border-color: #1e3a5f; }
        .transform-section { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
        .transform-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .stop-row { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
        .stop-row input[type="color"] { width: 45px; height: 35px; padding: 0; border: none; cursor: pointer; background: transparent; }
        .stop-list { margin-bottom: 20px; max-height: 380px; overflow-y: auto; padding-right: 5px; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .spoof-check { font-weight: normal; font-size: 13px; color: #fbbf24; cursor: pointer; display: none; align-items: center; gap: 6px; margin-top: 6px; background: #2d2006; padding: 6px 10px; border-radius: 4px; border: 1px solid #78350f;}
        .file-input-wrapper { display: inline-block; position: relative; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <h1>WxTool Palette Manager</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('convert')">Quick Convert</button>
        <button class="tab-btn" onclick="switchTab('create')">Create / Edit Studio</button>
    </div>

    <!-- QUICK CONVERT TAB -->
    <div id="convert" class="panel active">
        <div class="control-group">
            <label>Paste Input Data or Load File:</label>
            <textarea id="conv-input" placeholder="Paste Windy Array, GIS .pal, GRLevelX, NEXRAD Advanced, or GR2Analyst 2 text here..."></textarea>
            <div style="margin-top: 8px;" class="flex-row">
                <div class="file-input-wrapper">
                    <button class="secondary">&darr; Open File from Disk</button>
                    <input type="file" onchange="handleFileLoad(event, 'conv-input', 'conv-in-format')">
                </div>
            </div>
        </div>
        <div class="flex-row control-group" style="align-items: flex-start;">
            <div>
                <label>Input Format</label>
                <select id="conv-in-format">
                    <option value="auto">Auto-Detect</option>
                    <option value="windy">Windy Array</option>
                    <option value="gis">Standard GIS (.pal)</option>
                    <option value="grlevelx">GRLevelX</option>
                    <option value="nexrad">NEXRAD Advanced (.pal)</option>
                    <option value="gr2a2">GR2Analyst 2</option>
                </select>
            </div>
            <div>
                <label>Output Format</label>
                <select id="conv-out-format" onchange="toggleSpoof('conv'); runConversion();">
                    <option value="gis">Standard GIS (.pal)</option>
                    <option value="windy">Windy Array</option>
                    <option value="grlevelx">GRLevelX</option>
                    <option value="nexrad">NEXRAD Advanced (.pal)</option>
                    <option value="gr2a2">GR2Analyst 2</option>
                </select>
                <label class="spoof-check" id="conv-spoof-wrap">
                    <input type="checkbox" id="conv-force-radar" onchange="runConversion()"> 
                    Force Radar Header (Spoof App)
                </label>
            </div>
            <button onclick="runConversion()" style="height: 40px; align-self: flex-start; margin-top: 22px;">Convert Output &darr;</button>
        </div>
        <div class="control-group">
            <label>Output Data:</label>
            <textarea id="conv-output" readonly></textarea>
        </div>
        <div class="actions">
            <button onclick="copyText('conv-output')">Copy Output</button>
            <button class="secondary" onclick="downloadText('conv-output', 'palette')">Download File</button>
        </div>
    </div>

    <!-- CREATE / EDIT STUDIO TAB -->
    <div id="create" class="panel">
        
        <!-- IMPORT TO EDITOR -->
        <div class="transform-box import-box">
            <h3 style="margin-top: 0; color: var(--primary);">Import Palette into Studio</h3>
            <div class="control-group">
                <textarea id="import-editor-input" placeholder="Paste data here or pick a file below to load into visual editor..." style="height: 70px;"></textarea>
            </div>
            <div class="flex-row">
                <div>
                    <select id="import-editor-format">
                        <option value="auto">Auto-Detect</option>
                        <option value="gis">Standard GIS (.pal)</option>
                        <option value="windy">Windy Array</option>
                        <option value="grlevelx">GRLevelX</option>
                        <option value="nexrad">NEXRAD Advanced (.pal)</option>
                        <option value="gr2a2">GR2Analyst 2</option>
                    </select>
                </div>
                <div class="file-input-wrapper">
                    <button class="secondary">Choose File</button>
                    <input type="file" onchange="handleFileLoad(event, 'import-editor-input', 'import-editor-format')">
                </div>
                <button class="success" onclick="importToEditor()">Import & Load Data</button>
            </div>
        </div>

        <!-- TRANSFORMATIONS ENGINE -->
        <div class="transform-box">
            <h3 style="margin-top: 0; color: var(--text);">Value Transformations</h3>
            
            <div class="transform-section flex-row">
                <div>
                    <label>Unit Conversion</label>
                    <select id="unit-conversion-type">
                        <optgroup label="Temperature">
                            <option value="k_to_c">Kelvin to Celsius</option>
                            <option value="c_to_k">Celsius to Kelvin</option>
                            <option value="c_to_f">Celsius to Fahrenheit</option>
                            <option value="f_to_c">Fahrenheit to Celsius</option>
                            <option value="k_to_f">Kelvin to Fahrenheit</option>
                        </optgroup>
                        <optgroup label="Speed">
                            <option value="ms_to_kts">m/s to Knots</option>
                            <option value="kts_to_ms">Knots to m/s</option>
                            <option value="ms_to_mph">m/s to mph</option>
                            <option value="mph_to_ms">mph to m/s</option>
                        </optgroup>
                        <optgroup label="Distance / Precip">
                            <option value="mm_to_in">mm to Inches</option>
                            <option value="in_to_mm">Inches to mm</option>
                            <option value="mm_to_cm">mm to cm</option>
                            <option value="cm_to_mm">cm to mm</option>
                            <option value="cm_to_in">cm to Inches</option>
                        </optgroup>
                    </select>
                </div>
                <button onclick="applyUnitConversion()">Apply Conversion</button>
            </div>

            <div class="flex-row" style="margin-top: 10px;">
                <div>
                    <label>Manual Math</label>
                    <select id="math-operator">
                        <option value="add">Add (+)</option>
                        <option value="sub">Subtract (-)</option>
                        <option value="mult">Multiply (×)</option>
                        <option value="div">Divide (÷)</option>
                    </select>
                </div>
                <div>
                    <label>Value</label>
                    <input type="number" id="math-val" step="any" placeholder="e.g. 10" style="width: 100px;">
                </div>
                <button onclick="applyManualMath()">Apply Math</button>
            </div>
        </div>

        <label style="margin-bottom: 10px;">Color Stops Editor:</label>
        <div id="stop-container" class="stop-list">
            <!-- Stops injected here via JS -->
        </div>
        
        <button onclick="addStop()" style="margin-bottom: 20px;">+ Add New Stop</button>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">

        <div class="flex-row control-group" style="align-items: flex-start;">
            <div>
                <label>Export Format</label>
                <select id="create-out-format" onchange="toggleSpoof('create'); renderCreateOutput();">
                    <option value="gis">Standard GIS (.pal)</option>
                    <option value="windy">Windy Array</option>
                    <option value="grlevelx">GRLevelX</option>
                    <option value="nexrad">NEXRAD Advanced (.pal)</option>
                    <option value="gr2a2">GR2Analyst 2</option>
                </select>
                <label class="spoof-check" id="create-spoof-wrap">
                    <input type="checkbox" id="create-force-radar" onchange="renderCreateOutput()"> 
                    Force Radar Header (Spoof App)
                </label>
            </div>
        </div>
        <div class="control-group">
            <textarea id="create-output" readonly></textarea>
        </div>
        <div class="actions">
            <button onclick="copyText('create-output')">Copy Export</button>
            <button class="secondary" onclick="downloadText('create-output', 'custom_palette')">Download File</button>
        </div>
    </div>

<script>
    // --- APP STATE ---
    let colorStops = [
        { val: 263.15, r: 0, g: 0, b: 255, a: 255 },
        { val: 273.15, r: 255, g: 255, b: 255, a: 255 },
        { val: 283.15, r: 255, g: 0, b: 0, a: 255 }
    ];

    // --- UI NAVIGATION & TOGGLES ---
    function switchTab(tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
        if(tabId === 'create') renderStops();
    }

    function toggleSpoof(prefix) {
        let format = document.getElementById(prefix + '-out-format').value;
        let wrap = document.getElementById(prefix + '-spoof-wrap');
        if (format === 'nexrad') {
            wrap.style.display = 'flex';
        } else {
            wrap.style.display = 'none';
        }
    }

    function autoDetectFormat(text) {
        text = text.trim();
        if (text.startsWith("[")) return "windy";
        if (text.toLowerCase().includes("product:") && text.toLowerCase().includes("step:")) {
            // Distinguish GR2Analyst 2 from NEXRAD Advanced
            if (text.toLowerCase().includes("decimals:") || text.toLowerCase().includes("scale:")) {
                return "gr2a2";
            }
            return "nexrad";
        }
        if (text.toLowerCase().includes("color:") && text.toLowerCase().includes("value:")) return "grlevelx";
        if (text.toLowerCase().includes("color:") || text.toLowerCase().includes("color4:")) return "nexrad";
        return "gis";
    }

    function handleFileLoad(event, targetTextareaId, formatSelectId) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            let content = e.target.result;
            document.getElementById(targetTextareaId).value = content;
            if (formatSelectId) {
                let detected = autoDetectFormat(content);
                document.getElementById(formatSelectId).value = detected;
            }
        };
        reader.readAsText(file);
    }

    // --- PARSERS ---
    function parseInput(text, format) {
        let arr = [];
        text = text.trim();
        if (!text) {
            alert("Please paste data to import.");
            return null;
        }

        if (format === 'auto') {
            format = autoDetectFormat(text);
        }

        try {
            if (format === 'windy') {
                let parsed = JSON.parse(text);
                arr = parsed.map(i => ({ val: parseFloat(i[0]), r: parseInt(i[1][0]), g: parseInt(i[1][1]), b: parseInt(i[1][2]), a: Math.min(255, parseInt(i[1][3]) || 255) }));
            } 
            else if (format === 'gis') {
                let lines = text.split('\n');
                lines.forEach(l => {
                    if (!l.trim()) return;
                    let p = l.trim().split(/\s+/);
                    if (p.length >= 4) {
                        arr.push({ val: parseFloat(p[0]), r: parseInt(p[1]), g: parseInt(p[2]), b: parseInt(p[3]), a: p[4] ? Math.min(255, parseInt(p[4])) : 255 });
                    }
                });
            } 
            else if (format === 'grlevelx') {
                let lines = text.split('\n');
                let currentRGB = null;
                lines.forEach(l => {
                    l = l.trim();
                    if (l.toLowerCase().startsWith('color:')) {
                        let p = l.split(':')[1].trim().split(/\s+/);
                        currentRGB = { r: parseInt(p[0]), g: parseInt(p[1]), b: parseInt(p[2]) };
                    } else if (l.toLowerCase().startsWith('value:') && currentRGB) {
                        let val = parseFloat(l.split(':')[1].trim());
                        arr.push({ val: val, r: currentRGB.r, g: currentRGB.g, b: currentRGB.b, a: 255 });
                        currentRGB = null;
                    }
                });
            }
            else if (format === 'nexrad') {
                let lines = text.split('\n');
                lines.forEach(l => {
                    l = l.trim();
                    let lLower = l.toLowerCase();
                    if (lLower.startsWith('color:') || lLower.startsWith('color4:')) {
                        let p = l.split(/\s+/);
                        if (p.length >= 5) {
                            let val = parseFloat(p[1]);
                            let r = parseInt(p[2]);
                            let g = parseInt(p[3]);
                            let b = parseInt(p[4]);
                            let a = 255;
                            if (p[0].toLowerCase() === 'color4:' && p.length >= 6) {
                                a = parseInt(p[5]);
                            }
                            arr.push({ val: val, r: r, g: g, b: b, a: a });
                        }
                    }
                });
            }
            else if (format === 'gr2a2') {
                let lines = text.split('\n');
                lines.forEach(l => {
                    l = l.trim();
                    if (l.toLowerCase().startsWith('color:')) {
                        let parts = l.substring(6).trim().split(/\s+/);
                        if (parts.length >= 4) {
                            let val = parseFloat(parts[0]);
                            let r = parseInt(parts[1]);
                            let g = parseInt(parts[2]);
                            let b = parseInt(parts[3]);
                            let a = parts[4] ? Math.min(255, parseInt(parts[4])) : 255;
                            arr.push({ val: val, r: r, g: g, b: b, a: a });
                        }
                    }
                });
            }
        } catch (e) {
            alert("Error parsing input data. Please check the format.");
            return null;
        }
        return arr.sort((a,b) => a.val - b.val);
    }

    // --- FORMATTERS ---
    function formatOutput(arr, format, forceRadarSpoof) {
        if (!arr || arr.length === 0) return "";
        let sorted = [...arr].sort((a,b) => a.val - b.val);

        if (format === 'windy') {
            let strArr = sorted.map(i => `[${i.val},[${i.r},${i.g},${i.b},${i.a}]]`);
            return `[\n${strArr.join(',\n')}\n]`;
        } 
        else if (format === 'gis') {
            return sorted.map(i => `${i.val} ${i.r} ${i.g} ${i.b} ${i.a}`).join('\n');
        } 
        else if (format === 'grlevelx') {
            return sorted.map(i => `Color: ${i.r} ${i.g} ${i.b}\nValue: ${i.val}`).join('\n');
        }
        else if (format === 'nexrad') {
            let header = forceRadarSpoof ? "units: dBZ\nstep: 10\nproduct: BR\n\n" : "";
            let body = sorted.map(i => {
                if (i.a < 255) {
                    return `color4: ${i.val} ${i.r} ${i.g} ${i.b} ${i.a}`;
                } else {
                    return `color: ${i.val} ${i.r} ${i.g} ${i.b}`;
                }
            }).join('\n');
            return header + body;
        }
        else if (format === 'gr2a2') {
            let header = "Product: BR\nUnits: m/s\nStep: 10\nScale: 1\nDecimals: 1\n\n";
            let body = sorted.map(i => `Color: ${i.val} ${i.r} ${i.g} ${i.b} ${i.a}`).join('\n');
            return header + body;
        }
        return "";
    }

    // --- CONVERT LOGIC ---
    function runConversion() {
        let input = document.getElementById('conv-input').value;
        let inFormat = document.getElementById('conv-in-format').value;
        let outFormat = document.getElementById('conv-out-format').value;
        let forceRadar = document.getElementById('conv-force-radar').checked;
        
        let parsedArr = parseInput(input, inFormat);
        if (parsedArr) {
            document.getElementById('conv-output').value = formatOutput(parsedArr, outFormat, forceRadar);
        }
    }

    // --- EDITOR LOGIC ---
    function importToEditor() {
        let input = document.getElementById('import-editor-input').value;
        let format = document.getElementById('import-editor-format').value;
        let parsedArr = parseInput(input, format);
        
        if (parsedArr && parsedArr.length > 0) {
            colorStops = parsedArr;
            renderStops();
            document.getElementById('import-editor-input').value = ''; 
        }
    }

    function rgbToHex(r, g, b) {
        return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
    }
    
    function hexToRgb(hex) {
        let bigint = parseInt(hex.slice(1), 16);
        return { r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255 };
    }

    function renderStops() {
        let container = document.getElementById('stop-container');
        container.innerHTML = '';
        colorStops.forEach((stop, index) => {
            let hex = rgbToHex(stop.r, stop.g, stop.b);
            container.innerHTML += `
                <div class="stop-row">
                    <label style="margin:0;">Val:</label>
                    <input type="number" step="any" value="${stop.val}" oninput="updateStop(${index}, 'val', this.value)" style="width: 90px;">
                    
                    <label style="margin:0;">Color:</label>
                    <input type="color" value="${hex}" onchange="updateStopColor(${index}, this.value)">
                    
                    <label style="margin:0;">Alpha:</label>
                    <input type="number" min="0" max="255" value="${stop.a}" oninput="updateStop(${index}, 'a', this.value)" style="width: 65px;">
                    
                    <button class="danger" onclick="removeStop(${index})" style="padding: 6px 10px; margin-left:auto;">Remove</button>
                </div>
            `;
        });
        renderCreateOutput();
    }

    function updateStop(index, key, value) {
        let parsed = parseFloat(value);
        colorStops[index][key] = isNaN(parsed) ? 0 : parsed;
        renderCreateOutput(); // Updates export textarea without re-rendering DOM elements
    }

    function updateStopColor(index, hex) {
        let rgb = hexToRgb(hex);
        colorStops[index].r = rgb.r;
        colorStops[index].g = rgb.g;
        colorStops[index].b = rgb.b;
        renderCreateOutput();
    }

    function addStop() {
        let lastVal = colorStops.length > 0 ? colorStops[colorStops.length-1].val + 1 : 0;
        colorStops.push({ val: lastVal, r: 255, g: 255, b: 255, a: 255 });
        renderStops();
    }

    function removeStop(index) {
        colorStops.splice(index, 1);
        renderStops();
    }

    // --- TRANSFORMATIONS ---
    function roundVal(v) {
        return Math.round(v * 1000) / 1000;
    }

    function applyUnitConversion() {
        let type = document.getElementById('unit-conversion-type').value;
        colorStops.forEach(stop => {
            let v = stop.val;
            switch(type) {
                case 'k_to_c': v = v - 273.15; break;
                case 'c_to_k': v = v + 273.15; break;
                case 'c_to_f': v = (v * 9/5) + 32; break;
                case 'f_to_c': v = (v - 32) * 5/9; break;
                case 'k_to_f': v = (v - 273.15) * 9/5 + 32; break;
                case 'ms_to_kts': v = v * 1.94384; break;
                case 'kts_to_ms': v = v / 1.94384; break;
                case 'ms_to_mph': v = v * 2.23694; break;
                case 'mph_to_ms': v = v / 2.23694; break;
                case 'mm_to_in': v = v / 25.4; break;
                case 'in_to_mm': v = v * 25.4; break;
                case 'mm_to_cm': v = v / 10; break;
                case 'cm_to_mm': v = v * 10; break;
                case 'cm_to_in': v = v / 2.54; break;
            }
            stop.val = roundVal(v);
        });
        renderStops();
    }

    function applyManualMath() {
        let op = document.getElementById('math-operator').value;
        let val = parseFloat(document.getElementById('math-val').value);
        if (isNaN(val)) return;

        colorStops.forEach(stop => {
            let v = stop.val;
            switch(op) {
                case 'add': v += val; break;
                case 'sub': v -= val; break;
                case 'mult': v *= val; break;
                case 'div': if(val !== 0) v /= val; break;
            }
            stop.val = roundVal(v);
        });
        renderStops();
    }

    function renderCreateOutput() {
        let format = document.getElementById('create-out-format').value;
        let forceRadar = document.getElementById('create-force-radar').checked;
        document.getElementById('create-output').value = formatOutput(colorStops, format, forceRadar);
    }

    // --- UTILS ---
    function copyText(elementId) {
        let txt = document.getElementById(elementId);
        txt.select();
        document.execCommand("copy");
        alert("Copied to clipboard!");
    }

    function downloadText(elementId, baseName) {
        let txt = document.getElementById(elementId).value;
        if (!txt) return;
        
        let defaultExt = ".pal";
        if (txt.trim().startsWith("[")) defaultExt = ".json";

        let fileName = prompt("Enter file name to save as (including extension):", baseName + defaultExt);
        if (!fileName) return;
        
        let blob = new Blob([txt], { type: "text/plain" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Init display states
    toggleSpoof('conv');
    toggleSpoof('create');
    renderStops();
</script>
